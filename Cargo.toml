[workspace]
resolver = "3"
members = [
    "crates/ffr-module",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.43", features = ["bundled"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "time", "fs", "io-util", "sync"] }
